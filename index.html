<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f766e">
    <meta name="description" content="Gerenciamento de entregas de agua por caminhao-pipa.">
    <title>Pipa Entregas</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>
    <noscript>Este aplicativo precisa de JavaScript para funcionar.</noscript>

    <div class="app-shell">
      <header class="topbar" data-authenticated="false">
        <div>
          <p class="eyebrow">Pipa Entregas</p>
          <h1 id="page-title">Entrar</h1>
        </div>
        <button class="icon-button hidden" id="logout-button" type="button" aria-label="Sair">
          <span aria-hidden="true">Sair</span>
        </button>
      </header>

      <main id="app" class="app-content" tabindex="-1"></main>

      <nav class="bottom-nav hidden" id="bottom-nav" aria-label="Navegacao principal">
        <a href="#/dashboard" data-route="/dashboard">Inicio</a>
        <a href="#/clientes" data-route="/clientes">Clientes</a>
        <a href="#/agenda" data-route="/agenda">Agenda</a>
        <a href="#/rota" data-route="/rota">Rota</a>
        <a href="#/financeiro" data-route="/financeiro">Financeiro</a>
      </nav>
    </div>

    <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
